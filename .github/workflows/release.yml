name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > CHANGES.md
          if ! [ -s CHANGES.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION — add one before tagging (see version-management rule)"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: gh release create "$TAG" --title "$TAG" --notes-file CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # Every Fly deploy strategy replaces machines and SIGTERMs background
      # work, so a deploy landing mid-import kills the run (bluegreen protects
      # traffic only). Poll the public busy indicator until the app is idle.
      # Two halves in one field: `busy` covers active operation runs AND
      # queued-not-started export files (which have no run row yet).
      # Fail-open on an unreachable endpoint: an app that isn't serving can't
      # be running an import, and a hard-down app must never be able to block
      # its own fix from deploying.
      - name: Wait for in-flight imports to drain
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            body=$(curl -fsS --max-time 10 "https://mixd.fly.dev/api/v1/health?busy=true" || true)
            if [ -z "$body" ]; then
              echo "Health endpoint unreachable — nothing can be in flight; proceeding"
              break
            fi
            if [ "$(echo "$body" | jq -r '.busy')" != "true" ]; then
              # `busy` excludes running rows older than the reaper's 12h bound
              # (REAP_AGE_BOUND) as reaper-dead — surface that exclusion
              # instead of deploying over it silently.
              stale=$(echo "$body" | jq -r '.stale_running_operation_runs // 0')
              if [ "$stale" -gt 0 ]; then
                echo "::warning::Gate passed while $stale stale running row(s) were excluded as reaper-dead — if an import is genuinely still running past 12h, abort now."
              fi
              echo "No import in flight ($body) — proceeding with deploy"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::An import is still in flight after 30 minutes — deploy refused so it isn't killed mid-run. Wait for it to finish (or cancel it in the UI), then re-run this workflow."
              exit 1
            fi
            echo "Import in flight ($body) — retrying in 30s"
            sleep 30
          done

      - run: flyctl deploy --remote-only --build-arg "BUILD_HASH=$COMMIT_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
