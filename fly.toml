# fly.toml app configuration file generated for mixd on 2026-03-18T12:15:48-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mixd'
primary_region = 'sjc'

# Fly's long-running-tasks blueprint (2026-06): SIGTERM (not the SIGINT
# default) with the maximum drain window, so shutdown reaches the app's
# handlers — which cancel background tasks and record in-flight runs as
# interrupted — instead of killing them 5s after a signal they don't expect.
# This is a drain window, not a finish-your-work timer: a long import still
# dies on deploy, but honestly.
kill_signal = 'SIGTERM'
kill_timeout = '300s'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_NEON_AUTH_URL = 'https://ep-super-glade-ak6se863.neonauth.c-3.us-west-2.aws.neon.tech/neondb/auth'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  PYTHONUNBUFFERED = '1'
  NEON_AUTH_URL = 'https://ep-super-glade-ak6se863.neonauth.c-3.us-west-2.aws.neon.tech/neondb/auth'
  NEON_AUTH_JWKS_URL = 'https://ep-super-glade-ak6se863.neonauth.c-3.us-west-2.aws.neon.tech/neondb/auth/.well-known/jwks.json'
  ALLOWED_EMAILS = 'a@ashwright.net'

[http_service]
  internal_port = 8000
  force_https = true
  # Never 'stop': the proxy's excess-capacity rebalancing stops whichever
  # machine it picks — including one 54 minutes into a background import
  # (2026-08-08 incident: SIGINT mid-import, run falsely recorded complete).
  # Long-running work lives in-process, so machines must only stop on deploy.
  # Keep the machine count at 1 (`fly scale count 1`) — a second machine also
  # splits the in-process SSE registry and the concurrency cap.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Inert while auto_stop is 'off' (it only applies to stop/suspend modes);
  # kept for the day autostop is ever reconsidered, not as protection — it
  # guarantees a count, never a specific machine.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
